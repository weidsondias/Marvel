.ph h3{margin:0;font-size:17px}
.ph span{font-size:13px;color:var(--mu)}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x proximity}
.card{flex:none;width:124px;border:0;background:none;color:inherit;text-align:left;padding:0;cursor:pointer;scroll-snap-align:start;position:relative}

.m{font-size:12px;color:var(--mu);margin-top:6px}
.empty{margin:24px 16px;color:var(--mu)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}
#sheet.on{display:flex}
.box{background:var(--bg);width:100%;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}

@media (prefers-reduced-motion:reduce){.box{animation:none}}
.top{display:flex;gap:14px}
.top .p{width:100px;height:150px;flex:none}
.box h3{margin:0 0 4px;font-size:22px}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border-radius:10px;border:1px solid var(--sf);background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.note{font-size:13px;color:var(--mu);margin-top:8px}
.p.im{font-size:0;color:transparent;text-shadow:none}
footer{padding:24px 16px 32px;font-size:12px;color:var(--mu)}
.li{display:flex;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--sf);background:none;color:inherit;text-align:left;padding:10px 16px;font:inherit;cursor:pointer}
.li .n{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.li .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.li small{color:var(--mu);font-size:12px}
.li .v{color:var(--ac);font-weight:700}
.sec{margin:20px 16px 6px;font-size:20px}

</head>
